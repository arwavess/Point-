<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charge Point - Connexion</title>
    <!-- Lien indispensable pour PWABuilder / Application Android -->
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; }
        /* Remplacement du fond vert par le fond orange (#f97316) */
        body { background-color: #f97316; color: #333; min-height: 100vh; display: flex; flex-direction: column; }
        
        .top-header { background-color: #f97316; color: #fff; padding: 15px; display: flex; align-items: center; justify-content: center; position: relative; }
        .brand-title { font-size: 18px; font-weight: 500; }
        
        /* Conteneur principal blanc */
        .main-container { background-color: #fff; flex: 1; border-top-left-radius: 40px; padding: 35px 20px; margin-top: 10px; box-shadow: 0 -4px 15px rgba(0,0,0,0.05); }
        
        .form-group { margin-bottom: 25px; }
        .form-label { font-size: 14px; color: #333; font-weight: 400; margin-bottom: 8px; display: block; }
        .input-wrapper { position: relative; display: flex; align-items: center; border-bottom: 1px solid #e0e0e0; padding-bottom: 8px; }
        
        /* Remplacement de la couleur des icônes en orange */
        .input-icon { color: #f97316; font-size: 16px; margin-right: 10px; }
        
        .form-input { width: 100%; border: none; outline: none; font-size: 14px; color: #333; background: transparent; }
        .form-input::placeholder { color: #aaa; }
        .prefix-phone { color: #aaa; font-size: 14px; margin-right: 5px; }
        
        /* Bouton de validation en orange */
        .btn-submit { width: 100%; background: #f97316; color: #fff; border: none; padding: 14px; border-radius: 30px; font-size: 16px; font-weight: 500; cursor: pointer; text-align: center; margin-top: 20px; box-shadow: 0 4px 10px rgba(249, 115, 22, 0.3); }
        .btn-submit:active { opacity: 0.8; }
        
        .auth-footer { text-align: center; margin-top: 25px; font-size: 13px; color: #666; }
        /* Lien en bas en orange */
        .auth-footer a { color: #f97316; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

    <div class="top-header">
        <div class="brand-title">Se connecter</div>
    </div>

    <div class="main-container">
        <div class="form-group">
            <label class="form-label">Mobile</label>
            <div class="input-wrapper">
                <i class="fas fa-mobile-alt input-icon"></i>
                <span class="prefix-phone">+243</span>
                <input type="tel" id="phone" class="form-input" placeholder="Veuillez entrer votre numéro mobile" maxlength="10">
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Mot De Passe</label>
            <div class="input-wrapper">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" id="password" class="form-input" placeholder="S'il vous plaît mot de passe d'entrée">
            </div>
        </div>

        <button type="button" class="btn-submit" onclick="loginUser()">
            Se connecter
        </button>

        <div class="auth-footer">
            Vous n'avez pas de compte ? <a href="register.html">S'inscrire</a>
        </div>
    </div>

    <script>
        const dbUrl = "https://sonyy-9b565-default-rtdb.firebaseio.com";

        async function loginUser() {
            let phoneInput = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!phoneInput || phoneInput.length < 9) {
                alert("Veuillez entrer un numéro de téléphone valide.");
                return;
            }

            if(!phoneInput.startsWith("+243")) {
                if(phoneInput.startsWith("0")) phoneInput = "+243" + phoneInput.substring(1);
                else phoneInput = "+243" + phoneInput;
            }

            if (!password) {
                alert("Veuillez entrer votre mot de passe.");
                return;
            }

            try {
                const res = await fetch(`${dbUrl}/utilisateurs.json`);
                const allUsers = await res.json();

                let foundUserKey = null;
                let foundUserData = null;

                if (allUsers) {
                    for (let key in allUsers) {
                        if (allUsers[key].telephone === phoneInput) {
                            foundUserKey = key;
                            foundUserData = allUsers[key];
                            break;
                        }
                    }
                }

                if (!foundUserData) {
                    alert("Ce numéro de compte n'existe pas. Veuillez vous inscrire.");
                    return;
                }

                const userPassword = foundUserData.password || foundUserData.motDePasse || foundUserData.motDePassee;

                if (userPassword !== password) {
                    alert("Mot de passe incorrect.");
                    return;
                }

                const sessionData = {
                    firebaseId: foundUserKey,
                    telephone: foundUserData.telephone
                };
                localStorage.setItem('sonny_session', JSON.stringify(sessionData));

                alert("Connexion réussie ! Bienvenue sur Charge Point.");
                window.location.href = "dashboard.html";

            } catch (err) {
                console.error("Erreur technique :", err);
                alert("Impossible de contacter le serveur de base de données.");
            }
        }
    </script>
</body>
</html>
